<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Annuaire Pro Luxembourg">
  <title>Annuaire Pro Luxembourg</title>
  <!-- Drapeau du Luxembourg en arrière-plan : rouge, blanc, bleu clair -->
  <rect width="1200" height="210" y="0" fill="#ED2939"/>
  <rect width="1200" height="210" y="210" fill="#FFFFFF"/>
  <rect width="1200" height="210" y="420" fill="#00A1DE"/>
  <!-- Voile blanc pour garder le texte lisible, drapeau encore visible sur les bords -->
  <rect x="90" y="115" width="1020" height="400" rx="28" fill="#FFFFFF" fill-opacity="0.93"/>
  <rect x="90" y="115" width="1020" height="400" rx="28" fill="none" stroke="#21724e" stroke-width="6"/>
  <!-- Épingle de localisation verte -->
  <g transform="translate(600 205)">
    <path d="M0 -50 C-28 -50 -48 -29 -48 -3 C-48 30 0 72 0 72 C0 72 48 30 48 -3 C48 -29 28 -50 0 -50 Z" fill="#21724e"/>
    <circle cx="0" cy="-4" r="17" fill="#FFFFFF"/>
  </g>
  <!-- Nom -->
  <text x="600" y="355" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#21724e">Annuaire Pro</text>
  <text x="600" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#14472f">Luxembourg</text>
  <rect x="440" y="478" width="320" height="5" rx="2.5" fill="#21724e"/>
</svg>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajouter votre entreprise – Annuaire Pro Luxembourg</title>
<meta name="description" content="Inscrivez gratuitement votre entreprise dans l&#x27;annuaire des professionnels au Luxembourg.">
<link rel="canonical" href="https://annuaireproluxembourg.eu/ajouter/">

<link rel="stylesheet" href="/style.css">

</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">Annuaire Pro Luxembourg</a>
    <nav>
      <a href="/ajouter/">Ajouter votre entreprise</a>
      <a href="/visibilite/">Visibilité</a>
    </nav>
  </div>
</header>
<main class="wrap">

<h1>Ajouter votre entreprise</h1>
<p>L'inscription est <strong>gratuite</strong>. Votre fiche est vérifiée puis publiée sous quelques jours.</p>
<form action="https://formspree.io/f/REMPLACER_PAR_VOTRE_ID" method="POST" class="form">
  <label>Nom de l'entreprise <input name="nom" required></label>
  <label>Catégorie <input name="categorie" required placeholder="ex. Plombiers"></label>
  <label>Adresse <input name="adresse" required></label>
  <label>Code postal et ville <input name="ville" required></label>
  <label>Téléphone <input name="telephone"></label>
  <label>E-mail <input name="email" type="email" required></label>
  <label>Site web <input name="site" type="url" placeholder="https://"></label>
  <label>Description (2 phrases) <textarea name="description" rows="3"></textarea></label>
  <button type="submit">Envoyer</button>
</form>

</main>
<footer class="foot">
  <div class="wrap">
    <a href="/ajouter/">Ajouter une entreprise</a> ·
    <a href="/visibilite/">Boostez votre visibilité</a> ·
    <a href="/mentions-legales/">Mentions légales</a> ·
    <a href="/confidentialite/">Confidentialité</a>
    <p>© 2026 Annuaire Pro Luxembourg</p>
  </div>
</footer>
</body>
</html>
